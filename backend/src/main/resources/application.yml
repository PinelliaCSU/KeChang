# 课畅（KeChang）- 后端应用配置

server:
  port: 8080
  # GZIP 压缩：减少 JSON 响应体积 60%+
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain,application/javascript
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100

spring:
  application:
    name: kechang-backend
  profiles:
    active: dev

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.kechang.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志仅在 dev 环境启用，生产环境关闭以提升性能
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: kechang-jwt-secret-key-2024-this-is-a-very-long-secret-for-hs256
  expiration: 604800000  # 7天（毫秒）
  header: Authorization
  prefix: "Bearer "

# SpringDoc 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 文件存储路径
kechang:
  upload:
    path: ./uploads
  office:
    # 安装 LibreOffice 后建议显式配置，Word 转 PDF 才能保留表格、图片和复杂格式
    # Windows 示例："C:/Program Files/LibreOffice/program/soffice.exe"
    soffice-path:

# 阿里百炼（DashScope）AI 配置
bailian:
  api-key: ${AI_API_KEY:${BAILIAN_API_KEY:}}
  model: ${AI_MODEL:qwen-turbo}
  endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  connect-timeout: 30
  read-timeout: 300
  asr:
    enabled: ${ASR_ENABLED:true}
    # OpenAI-compatible 音频转写接口；如果你们使用其他 ASR 服务，改这里即可。
    endpoint: ${ASR_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
    model: ${ASR_MODEL:whisper-large-v3}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:300}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    endpoint: ${EMBEDDING_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
    model: ${EMBEDDING_MODEL:text-embedding-v3}
    fallback-dimension: ${EMBEDDING_FALLBACK_DIMENSION:256}
