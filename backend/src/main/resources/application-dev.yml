# 开发环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kechang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&cachePrepStmts=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus: 开发环境启用 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 阿里百炼（DashScope）AI 配置（开发环境）
bailian:
  api-key: sk-09dd1907b09e4e168ec2bf1647951a83
  model: ${AI_MODEL:qwen-turbo}
  endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  asr:
    enabled: ${ASR_ENABLED:true}
    endpoint: ${ASR_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
    model: ${ASR_MODEL:whisper-large-v3}
    ffmpeg-path: D:/ffmpeg/ffmpeg-8.1.2-essentials_build/bin/ffmpeg.exe
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:300}
