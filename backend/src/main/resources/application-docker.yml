# Docker 环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/kechang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia\Shanghai&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:kechang}
    password: ${SPRING_DATASOURCE_PASSWORD:kechang123}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:redis123}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
# 阿里百炼（DashScope）AI 配置（Docker 环境通过环境变量注入）
bailian:
  api-key: ${BAILIAN_API_KEY}