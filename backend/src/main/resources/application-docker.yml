# Docker 环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/kechang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia\Shanghai&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:kechang}
    password: ${SPRING_DATASOURCE_PASSWORD:kechang123}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:redis123}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

kechang:
  office:
    soffice-path: ${SOFFICE_PATH:/usr/bin/soffice}

# 阿里百炼（DashScope）AI 配置（Docker 环境通过环境变量注入）
bailian:
  api-key: ${BAILIAN_API_KEY}
  model: ${AI_MODEL:qwen-turbo}
  endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  asr:
    enabled: ${ASR_ENABLED:true}
    endpoint: ${ASR_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
    model: ${ASR_MODEL:whisper-large-v3}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:300}
