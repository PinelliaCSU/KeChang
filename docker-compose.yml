version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kechang-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: kechang
      MYSQL_USER: kechang
      MYSQL_PASSWORD: kechang123
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - kechang-net

  redis:
    image: redis:7-alpine
    container_name: kechang-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - kechang-net

  backend:
    build: ./backend
    container_name: kechang-backend
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kechang?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: kechang
      SPRING_DATASOURCE_PASSWORD: kechang123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: redis123
    ports:
      - "8080:8080"
    networks:
      - kechang-net

  frontend:
    build: ./fronted
    container_name: kechang-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kechang-net

volumes:
  mysql_data:
  redis_data:

networks:
  kechang-net:
    driver: bridge
