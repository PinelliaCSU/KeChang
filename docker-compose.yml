name: kechang

services:
  mysql:
    image: mysql:8.0
    container_name: kechang-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: kechang
      MYSQL_USER: kechang
      MYSQL_PASSWORD: kechang123
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=512M --max-connections=200
    networks:
      - kechang-net

  redis:
    image: redis:7-alpine
    container_name: kechang-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - kechang-net

  backend:
    build: ./backend
    container_name: kechang-backend
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kechang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kechang
      SPRING_DATASOURCE_PASSWORD: kechang123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: redis123
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-turbo}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      ASR_ENDPOINT: ${ASR_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      SOFFICE_PATH: ${SOFFICE_PATH:-/usr/bin/soffice}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
    ports:
      - "8080:8080"
    volumes:
      # 挂载 Docker socket，允许后端创建沙箱容器执行学生代码
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kechang-net

  frontend:
    build: ./fronted
    container_name: kechang-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kechang-net

volumes:
  mysql_data:
  redis_data:

networks:
  kechang-net:
    driver: bridge
